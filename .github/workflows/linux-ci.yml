name: Linux CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.release }} / build + acceptance
    runs-on: ubuntu-${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential autoconf automake python3 python3-pytest ca-certificates
      - name: Import pinned upstream and build
        run: |
          ./tools/import-upstream.sh
          ./tools/build.sh
      - name: Run functional and reload tests
        env:
          RINETD_RELOAD_CYCLES: '20'
        run: ./tools/acceptance-linux.sh
      - name: Validate packaging scripts
        run: bash -n install.sh tools/*.sh
      - name: Build DEB (experimental)
        run: ./tools/build-deb.sh
      - name: Upload DEB for inspection
        uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-${{ matrix.release }}
          path: dist/*.deb
          if-no-files-found: error

  rocky:
    name: Rocky Linux ${{ matrix.release }} / build + acceptance
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ['8', '9', '10']
    steps:
      - name: Install toolchain and Python tests
        run: |
          dnf install -y git gcc make autoconf automake python3 python3-pip ca-certificates tar gzip
          if ! python3 -m pytest --version >/dev/null 2>&1; then
            dnf install -y python3-pytest || python3 -m pip install --no-cache-dir pytest
          if [ "${{ matrix.release }}" = '8' ]; then python3 -m pip install --no-cache-dir --upgrade 'pytest==6.2.5'; fi
          fi
      - uses: actions/checkout@v4
      - name: Import pinned upstream and build
        run: |
          ./tools/import-upstream.sh
          ./tools/build.sh
      - name: Run functional and reload tests
        env:
          RINETD_RELOAD_CYCLES: '20'
        run: ./tools/acceptance-linux.sh
      - name: Validate packaging scripts
        run: bash -n install.sh tools/*.sh

  source-check:
    name: Source and license checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell/Python sources and attribution
        run: |
          test -s COPYING
          test -s docs/CONFIGURATION.md
          bash -n install.sh tools/*.sh
          python3 -m compileall -q bin tools tests
          git diff --check
